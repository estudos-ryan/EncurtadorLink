<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Encurtador De Link</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Encurtador de Links <span style="font-size: 16px">Base62</span></h1>
        <p>Gerar link encurtado até 24h</p>

        <div>
            <label for="duracao">Duração do link:</label>

            <select id="duracao">
                <option value="60000">1 minuto</option>
                <option value="300000">5 minutos</option>
                <option value="900000">15 minutos</option>
                <option value="1800000" selected>30 minutos</option>
                <option value="3600000">1 hora</option>
                <option value="21600000">6 horas</option>
                <option value="43200000">12 horas</option>
                <option value="86400000">24 horas</option>
            </select>
        </div>

        <div>
            <input type="url" id="urlInput" placeholder="Cole sua URL aqui">
            <button onclick="encurtar()">Encurtar</button>
        </div>

        <div id="resultado"></div>
    </div>

    <script>
        async function encurtar() {
            const duracao = Number(document.getElementById("duracao").value)
            const url = document.getElementById("urlInput").value;
            if (!url) return alert("Digite uma URL válida!");

            try {
                const resposta = await fetch("/encurtar", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ url, duracao })
                });

                const dados = await resposta.json();
                const div = document.getElementById("resultado");
                div.innerHTML = `Seu link: <a href="${dados.urlCurta}" target="_blank">${dados.urlCurta}</a>`;
            } catch (e) {
                alert("Erro de conexão.");
            }
        }
    </script>
</body>

</html>
